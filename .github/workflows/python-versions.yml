name: Python versions

# Does this package's own code install and pass its tests on every supported Python? ci.yml tests one version; this checks the range.
# Python 3.10 reaches end of life in October 2026: drop it from this list and from requires-python after that.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  versions:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install --upgrade pip && pip install -e . pytest
      - run: python -m pytest tests -q
