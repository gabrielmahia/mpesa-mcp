name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install this repository's code (not the published package)
        run: pip install --upgrade pip && pip install -e . pytest ruff
      - name: Lint
        run: ruff check . --ignore E501 --ignore F401
      - name: Test
        run: python -m pytest tests -q
